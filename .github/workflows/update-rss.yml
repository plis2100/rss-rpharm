name: Actualizar RSS de R-Pharm

on:
  workflow_dispatch:

  schedule:
    - cron: "37 * * * 1-6"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-rpharm
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar horario de Madrid
        if: github.event_name == 'schedule'
        id: horario
        shell: bash
        run: |
          HORA=$(TZ=Europe/Madrid date +%H)
          echo "Hora actual en Madrid: $HORA"

          if [ "$HORA" -ge 7 ] && [ "$HORA" -le 22 ]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          else
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependencias
        if: github.event_name == 'workflow_dispatch' || steps.horario.outputs.ejecutar == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.32.3 beautifulsoup4==4.12.3 feedgen==1.0.0 python-dateutil==2.9.0.post0

      - name: Crear RSS
        if: github.event_name == 'workflow_dispatch' || steps.horario.outputs.ejecutar == 'true'
        run: python generate_feed.py

      - name: Guardar RSS
        if: github.event_name == 'workflow_dispatch' || steps.horario.outputs.ejecutar == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/feed.xml

          if git diff --cached --quiet; then
            echo "No hay cambios en el RSS."
            exit 0
          fi

          git commit -m "Actualizar RSS de R-Pharm"
          git pull --rebase origin main
          git push origin main
